<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&A Deals Dashboard</title>

    <link rel="stylesheet" href="assets/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header>
        <h1>M&A Deals Dashboard</h1>
    </header>

    <section class="kpi-container">

        <div class="kpi-card">
            <h3>Total Deals</h3>
            <p id="totalDeals">0</p>
        </div>

        <div class="kpi-card">
            <h3>Average Deal Value</h3>
            <p id="avgDealValue">0</p>
        </div>

        <div class="kpi-card">
            <h3>Regions</h3>
            <p id="totalRegions">0</p>
        </div>

    </section>

    <section class="chart-container">

        <canvas id="dealChart"></canvas>

    </section>

    <script src="assets/dashboard.js"></script>

</body>
</html>
